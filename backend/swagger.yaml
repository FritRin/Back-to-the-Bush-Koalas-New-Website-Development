openapi: 3.0.0

info:
  title: Back to the Bush Koalas API
  version: 1.0.0
  description: API documentation for the Back to the Bush Koalas website.

servers:
  - url: http://localhost:3000

paths:
  # KOALAS
  /api/koalas:
    get:
      summary: Retrieve all koalas
      tags:
        - Koalas
      responses:
        "200":
          description: Successfully retrieved koalas
        "500":
          description: Internal Server Error

    post:
      summary: Create a new koala
      tags:
        - Koalas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - admin_id
                - koala_name
                - description
                - status
              properties:
                admin_id:
                  type: integer
                  example: 1
                koala_name:
                  type: string
                  example: Barry
                description:
                  type: string
                  example: A young koala recovering from an injury.
                image_url:
                  type: string
                  nullable: true
                  example: https://example.com/koala.jpg
                status:
                  type: string
                  example: Recovering
      responses:
        "201":
          description: Koala successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Koala"
        "400":
          description: Invalid input or admin ID does not exist
        "500":
          description: Internal Server Error

  /api/koalas/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Koala's ID
        schema:
          type: integer

    get:
      summary: Retrieve a koala by ID
      tags:
        - Koalas
      responses:
        "200":
          description: Successfully retrieved koala
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Koala"
        "400":
          description: Invalid koala ID
        "404":
          description: Koala not found
        "500":
          description: Internal Server Error

    put:
      summary: Update an existing koala
      tags:
        - Koalas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                koala_name:
                  type: string
                  example: Barry
                description:
                  type: string
                  example: Barry is recovering well.
                image_url:
                  type: string
                  nullable: true
                  example: https://example.com/updated-koala.jpg
                status:
                  type: string
                  example: Ready for release
      responses:
        "200":
          description: Koala successfully updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Koala"
        "400":
          description: Invalid input or no update fields provided
        "404":
          description: Koala not found
        "500":
          description: Internal Server Error

    delete:
      summary: Delete a koala
      tags:
        - Koalas
      responses:
        "200":
          description: Koala successfully deleted
        "400":
          description: Invalid koala ID
        "404":
          description: Koala not found
        "409":
          description: Cannot delete koala because it is referenced by another record
        "500":
          description: Internal Server Error

  # CUSTOMERS
  /api/customers:
    get:
      summary: Retrieve all customers
      tags:
        - Customers
      responses:
        "200":
          description: Successfully retrieved customers
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  status:
                    type: integer
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Customer"
        "500":
          description: Internal Server Error

    post:
      summary: Create a new customer
      tags:
        - Customers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                  example: Jack
                last_name:
                  type: string
                  example: Smith
                email:
                  type: string
                  example: jack@example.com
                phone:
                  type: string
                  example: "0400123456"
                street_number:
                  type: string
                  example: "10"
                street_name:
                  type: string
                  example: Main Street
                suburb:
                  type: string
                  example: Toowoomba
                state:
                  type: string
                  example: Queensland
                postcode:
                  type: string
                  example: "4350"
                country:
                  type: string
                  example: Australia
                company_name:
                  type: string
                  example: Example Company
      responses:
        "201":
          description: Customer successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          description: Invalid customer data
        "500":
          description: Internal Server Error

  /api/customers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Customer's ID
        schema:
          type: integer

    get:
      summary: Retrieve a customer by ID
      tags:
        - Customers
      responses:
        "200":
          description: Successfully retrieved customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          description: Invalid customer ID
        "404":
          description: Customer not found
        "500":
          description: Internal Server Error

  # KOALA STORIES
  /api/koala-stories:
    get:
      summary: Retrieve all koala stories
      tags:
        - Koala Stories
      responses:
        "200":
          description: Koala stories retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  status:
                    type: integer
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/KoalaStory"
        "500":
          description: Internal Server Error

    post:
      summary: Create a new koala story
      tags:
        - Koala Stories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - koala_id
                - admin_id
                - title
                - content
              properties:
                koala_id:
                  type: integer
                  example: 1
                admin_id:
                  type: integer
                  example: 1
                title:
                  type: string
                  example: "Tim - A Koala's Recovery"
                content:
                  type: string
                  example: This koala is recovering well after receiving care.
      responses:
        "201":
          description: Koala story created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  status:
                    type: integer
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/KoalaStory"
        "400":
          description: Invalid request data
        "500":
          description: Internal Server Error

  /api/koala-stories/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Koala story ID
        schema:
          type: integer

    get:
      summary: Retrieve a koala story by ID
      tags:
        - Koala Stories
      responses:
        "200":
          description: Koala story retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KoalaStory"
        "400":
          description: Invalid Koala Story ID
        "404":
          description: Koala story not found
        "500":
          description: Internal Server Error

    put:
      summary: Update a koala story
      tags:
        - Koala Stories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                koala_id:
                  type: integer
                  example: 1
                admin_id:
                  type: integer
                  example: 1
                title:
                  type: string
                  example: Updated Koala Recovery Story
                content:
                  type: string
                  example: The koala has made further progress in recovery.
      responses:
        "200":
          description: Koala story updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KoalaStory"
        "400":
          description: Invalid request data
        "404":
          description: Koala story not found
        "500":
          description: Internal Server Error

    delete:
      summary: Delete a koala story
      tags:
        - Koala Stories
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Koala story deleted successfully
        "400":
          description: Invalid Koala Story ID
        "404":
          description: Koala story not found
        "500":
          description: Internal Server Error

components:
  schemas:
    Koala:
      type: object
      properties:
        koala_id:
          type: integer
          example: 1
        admin_id:
          type: integer
          example: 1
        koala_name:
          type: string
          example: Barry
        description:
          type: string
          example: A young koala recovering from an injury.
        image_url:
          type: string
          nullable: true
          example: https://example.com/koala.jpg
        status:
          type: string
          example: Recovering
        date_added:
          type: string
          format: date-time

    Customer:
      type: object
      properties:
        customer_id:
          type: integer
          example: 1
        first_name:
          type: string
          nullable: true
          example: Jack
        last_name:
          type: string
          nullable: true
          example: Smith
        email:
          type: string
          nullable: true
          example: jack@example.com
        phone:
          type: string
          nullable: true
          example: "0400123456"
        street_number:
          type: string
          nullable: true
          example: "10"
        street_name:
          type: string
          nullable: true
          example: Main Street
        suburb:
          type: string
          nullable: true
          example: Toowoomba
        state:
          type: string
          nullable: true
          example: Queensland
        postcode:
          type: string
          nullable: true
          example: "4350"
        country:
          type: string
          nullable: true
          example: Australia
        company_name:
          type: string
          nullable: true
          example: Example Company
        created_date:
          type: string
          format: date-time

    KoalaStory:
      type: object
      properties:
        story_id:
          type: integer
          example: 1
        koala_id:
          type: integer
          example: 1
        admin_id:
          type: integer
          example: 1
        title:
          type: string
          example: "Tim - A Koala's Recovery"
        content:
          type: string
          example: This koala is recovering well after receiving care.
        created_at:
          type: string
          format: date-time
